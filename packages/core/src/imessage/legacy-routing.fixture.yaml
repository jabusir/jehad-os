# Jehad OS autonomy ceiling — policy.yaml v1 (§35 pattern; plan §9; ADR-0007).
# Policy is data, not model judgment: models propose; policy disposes.
# Levels: autonomous | gated | approval_required | prohibited.
# v1 ships exactly the five action types below; later versions may add the
# further §35 dimensions (domain, amount/impact, reversibility, confidence,
# data sensitivity, user-defined rules). Every evaluation denies by default.
version: 1
autonomy_ceiling:
  read: autonomous
  propose: autonomous
  write_canonical: gated
  external_side_effect: approval_required
  money_and_contracts: prohibited

# notifications — E4 (OpenClaw attach) delivery policy. The notification queue
# sits BEHIND review/policy: creation consults these keys, never model judgment.
#   autoApproveKinds      — notification kinds that skip the user review queue
#                           and land status=approved at creation (briefs are
#                           self-authored structured output, not external
#                           actions; calendar-change rows are pre-gated by the
#                           producer's 48h disruptive-change filter — ONLY
#                           start_end_changed/cancelled whose (new or previous)
#                           start falls within the NEXT 48h enqueue at all.
#                           That filter IS the noise gate: created/updated
#                           changes ride the morning brief instead. Everything
#                           else — escalation, custom — lands pending until
#                           POST /notifications/:id/approve.
#   escalationMinUrgency  — an escalation raise enqueues a delivery
#                           notification only at/above this urgency
#                           (low < medium < high < critical < blocker).
#                           Escalations stay at >= high: they interrupt a
#                           human and must never fire below it.
#   defaultTtlMinutes     — delivery window stamped on new notifications as
#                           expires_at; past it a row is expired and can never
#                           be claimed or delivered.
notifications:
  autoApproveKinds: ["brief", "calendar-change", "calibration", "grant-reminder", "typing"]
  escalationMinUrgency: high
  defaultTtlMinutes: 240

# gateway — iMessage multi-principal conversational budgets (Lane P; keyed by
# principal NAME). A principal absent here is DENIED conversation (fail
# closed): caps are owner-tuned config, not state (§5.4). Enforcement counts
# model_calls rows (principal_id + surface='imessage') over rolling-hour and
# UTC-day windows BEFORE dispatch. Model id must pass the egress policy for
# personal/normal. NOTE (deviation from the contracts sketch): the sketched
# `openrouter/auto-fast` is not in the repo's allowlisted model ids; the
# cheapest fast allowlisted model is the evals-pinned openai/gpt-4o-mini.
gateway:
  # §22 dual-window test fixture: identical to the live policy except
  # routing stays legacy — the suites referencing this file pin the LEGACY
  # orchestration path (the rollback path) while dogfood runs on single.
  routing: legacy
  # per-pass model routing — W3 tiers, RESET C7 (2026-09-24 bake-off,
  # docs/evals + evals/model-bakeoff/out/): route+interpret upgraded from
  # gpt-4.1-mini to gpt-4.1 — the live probe measured the mini at 88.9%
  # strict-parse validity (≈1 in 9 turns route-parse-failing into the
  # fallback retry) while gpt-4.1 hit 97.2% combined at FASTER latency
  # (~980ms) and best reference agreement (80.6/91.7); answer FAST retired
  # from 4o-mini to gpt-4.1 (short nuanced turns were exactly the
  # mini-class blind spot — "call me Sir, not Chief" classified FAST).
  # STANDARD/DEEP keep sonnet-4.5 (Track A incumbent: 4.79 mean, best
  # honesty 4.96; no candidate cleared the +0.3 D-1 bar — the answer
  # layer was never the binding constraint). Track A field:
  # opus-4.6 4.81 / sonnet 4.79 / 4.1-mini 4.75 / gpt-4.1 4.71 / 4o-mini
  # 4.67, spread 0.14. Fallbacks unchanged (multi-vendor gemini-3.8-flash).
  # C8 (single merged cognitive pass) justified-but-deferred per O-15:
  # gpt-4.1 clears the D-2 bar, but two gpt-4.1 passes ≈ $0.0025/~2s —
  # revisit after dogfood.
  passes: { route: { model: openai/gpt-4.1 }, answer_fast: { model: openai/gpt-4.1 }, answer_standard: { model: anthropic/claude-sonnet-4.5 }, answer_fallback: { model: google/gemini-3.8-flash }, route_fallback: { model: google/gemini-3.8-flash } }
  capture: { enabled: true, principals: [josctl], max_per_hour: 5, dedupe_window_hours: 24 }
  # review — Phase G deterministic review/control over iMessage
  # (ig-phase-g-contracts.md §7). Control commands are exact-match, zero
  # model calls (deterministicReply class); refs are owner-scoped 3-char
  # Crockford codes minted per queue item at first surfacing.
  review: { enabled: true, principals: [josctl], max_bad_refs: 3, snooze_hours: 24, ref_ttl_hours: 168, digest_max_candidates: 10, digest_max_escalations: 5 }
  # actions — Phase H consequential-action lane (calendar_create v1). Always-
  # confirm model: there is deliberately NO key that could disable per-action
  # owner confirmation (ig-phase-h-contracts.md §2/§7). Quotas are per-principal
  # UTC-day flood bounds over proposals and confirmed dispatches; they never
  # buy silence. Defaults are ESCALATE-4 (owner tunes).
  actions: { enabled: true, principals: [josctl], max_proposals_per_day: 10, max_dispatches_per_day: 5, confirm_ttl_minutes: 10 }
  context: { enabled: true, max_reads_per_turn: 3, per_block_token_budget: 1500 }
  interpret: { enabled: true }
  principals:
    yusra: { model: openai/gpt-4o-mini, requests_per_hour: 20, cost_per_day: 2.0 }
    josctl: { model: openai/gpt-4o-mini, requests_per_hour: 60, cost_per_day: 5.0, reads: [calendar, commitments, gmail, state, memory, system] }

# personas — W4 interaction-profile switch (jarvis-v1.md §7 W4 rev2 R2;
# §5 invariant 2). SECURITY/DEFAULT LAYER ONLY: the on/off flag plus the
# principals allowed to hold conversation profiles. Deliberately nothing
# else — NO prompt text, register, brevity, or address content lives here;
# profile content is versioned data in interaction_profiles (append-only,
# active = max version) and can never alter reads, tools, budgets, egress,
# or authorization. Disabled until the owner approves the initial josctl
# seed profile (§18-2); flip to enabled + principals: [josctl] then.
personas: { enabled: true, principals: [josctl] }

# sensors — cloud sensor policy (GMAIL; gmail-sensor-contracts.md §5/§10.3).
# sensors.gmail: metadata ingest for ALL senders; deterministic extraction
# ONLY for extract_senders globs over the From address (ESCALATE-4 — the
# owner ratifies the default and the list). enabled:false is the kill
# switch (§9.4): the sync grant fails closed and the sensor halts without
# touching the Google credential. Absent section = same fail-safe defaults.
# calibration — proactive world-model feedback loop (owner spec 2026-09-21):
# one compact daily prompt per principal during active soak, independent of
# evening-close suppression; bare 1-5 / "rate N" rate the day's picture;
# prose replies to an open prompt record as missed-feedback evidence.
calibration:
  daily: { enabled: true, principals: [josctl], prompt_local_hour: 20 }

outcomes: { enabled: true, max_active_per_principal: 3, default_budget_usd: 5, default_deadline_days: 14 }

# workers — D1 (roadmap §8): the worker contract's autonomy ceiling. Workers
# are roles with typed assignments, never free agents: each role pins its
# model (must pass the egress policy), a per-assignment hard budget (USD, ≤50),
# a deadline default, and a read allowlist that bounds the context-package
# builder. Absent role = deny at dispatch; the section absent entirely =
# worker fleet disabled (fail closed). Verification assignments land in D3
# behind this same ceiling (role 'verifier' reserved).
workers:
  enabled: true
  research: { model: openai/gpt-4.1-mini, max_budget_usd: 1, default_deadline_minutes: 30, reads: [gmail.metadata.recent, calendar.today, commitments.waiting, memory.relevant] }
  verifier: { model: openai/gpt-4.1-mini, max_budget_usd: 0.5, default_deadline_minutes: 15, reads: [] }

sensors:
  gmail: { enabled: true, poll_cron: "*/5 * * *", bootstrap_window_days: 30, extract_senders: [billing@*, statements@*, *@stripe.com], max_messages_per_poll: 40, max_candidates_per_day: 20, content_enabled: true, content_retention_days: 7, content_max_body_bytes: 262144 }